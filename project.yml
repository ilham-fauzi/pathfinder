name: Pathfinder
options:
  bundleIdPrefix: com.pathfinder
packages:
  SafariConverterLib:
    url: https://github.com/AdguardTeam/SafariConverterLib.git
    from: 4.3.0
targets:
  Pathfinder:
    type: application
    dependencies:
      - package: SafariConverterLib
        product: ContentBlockerConverter
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Pathfinder
    resources:
      - path: Pathfinder/Resources
    info:
      path: Pathfinder/Resources/Info.plist
    entitlements:
      path: Pathfinder/Resources/Pathfinder.entitlements
    settings:
      SWIFT_VERSION: "6.0"
      PRODUCT_NAME: Pathfinder
